<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />

    <!-- Primary Meta Tags (will be overridden by react-helmet-async) -->
    <title>Sequence - Free Online Multiplayer Board Game</title>
    <meta name="title" content="Sequence - Free Online Multiplayer Board Game" />
    <meta name="description" content="Play Sequence online for free! Strategic multiplayer board game with real-time gameplay. Create games, invite friends, and compete. No download required." />
    <meta name="keywords" content="sequence game, online board game, multiplayer game, free online game, sequence online, strategy game" />
    <meta name="author" content="Ajay Nair" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1f2937" />

    <!-- Open Graph / Facebook (fallback) -->
    <meta property="og:type" content="game" />
    <meta property="og:url" content="https://koinoyokan1.github.io/sequence/" />
    <meta property="og:title" content="Sequence - Free Online Multiplayer Board Game" />
    <meta property="og:description" content="Play Sequence online for free! Strategic multiplayer board game with real-time gameplay." />
    <meta property="og:image" content="https://koinoyokan1.github.io/sequence/og-images/landing.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Sequence Online" />

    <!-- Twitter (fallback) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://koinoyokan1.github.io/sequence/" />
    <meta name="twitter:title" content="Sequence - Free Online Multiplayer Board Game" />
    <meta name="twitter:description" content="Play Sequence online for free! Strategic multiplayer board game with real-time gameplay." />
    <meta name="twitter:image" content="https://koinoyokan1.github.io/sequence/og-images/landing.png" />

    <!-- Mobile Web App - Fullscreen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
    <meta name="apple-mobile-web-app-title" content="Sequence" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
